<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MO! Search</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>

    <div class="app">
      <div class="title-wrap">
        <div class="title">MO!</div>
      </div>

      <form id="searchForm" class="search-panel" autocomplete="off">
        <div class="engine-select-wrap">
          <label for="engineSelect" class="sr-only">Search engine</label>
          <select id="engineSelect" aria-label="Choose search engine">
            <option value="duckduckgo" selected>DuckDuckGo</option>
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="brave">Brave</option>
            <option value="ecosia">Ecosia</option>
            <option value="wikipedia">Wikipedia</option>
          </select>
        </div>

        <div class="search-box">
          <input
            id="searchInput"
            type="text"
            placeholder="Search..."
            aria-label="Search"
          />
          <button type="submit" aria-label="Submit search">Search</button>
        </div>
      </form>

      <div class="results-wrap">
        <iframe
          id="resultsFrame"
          title="Search results"
          referrerpolicy="strict-origin-when-cross-origin"
          loading="lazy"
        ></iframe>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
